services:
  backend:
    build: ./backend
    container_name: notes-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  tests:
    build: ./backend # тот же Dockerfile, что и у backend
    container_name: notes-tests
    command: pytest -v # переопределяем CMD из Dockerfile
    depends_on:
      - backend
    profiles:
      - test
