services:
  db:
    image: postgres:15-alpine
    container_name: notes-db
    environment:
      POSTGRES_PASSWORD: postgres
    #   ports:
    #    - "5432:5432"
    expose:
      - "5432"
    #volumes:
    #  - postgres_data:/var/lib/postgresql/data # Сохранение данных при перезапуске
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: notes-backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/postgres
      - JWT_KEY=16406ef703464a7c1cf0872fb529e23dff080667c1a84f358e56291da7b03068
    #ports:
    #  - "8000:8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: notes-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    restart: unless-stopped

  tests:
    build: ./backend # тот же Dockerfile, что и у backend
    container_name: notes-tests
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/postgres
    command: pytest -v # переопределяем CMD из Dockerfile
    depends_on:
      - backend
    profiles:
      - test
#volumes:
#  postgres_data:
