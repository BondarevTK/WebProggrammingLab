server {
    listen 80;
    server_name localhost; # Замените на ваш домен или IP, если есть

    # Перенаправляем ВСЕ запросы на HTTPS с сохранением пути и параметров
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost; # Ваш домен или IP
    ssl_certificate /etc/nginx/ssl/localhost.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost-key.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Важно для SPA
    }
    location /images/{
    }
    location /api/ {
        # 'api' — это имя сервиса в docker-compose, доступное по внутренней сети
        proxy_pass http://backend:8000/;

        # Важные заголовки для корректной работы FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
